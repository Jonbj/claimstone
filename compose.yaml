# Everything that runs: `docker compose up -d --build` starts GROBID, the read-only API (`api`), the write
# boundary (`control`) and the portal (`web`, http://127.0.0.1:8788/). Two services are not started by it:
# the engine job `claimstone` (profile `cli`, run with `docker compose run --rm claimstone …`) and the trial
# scheduler worker (profile `trial`).
#
# Of the long-running services, one is still not a service.
#
# `grobid` is long-running and stateless: it answers HTTP, holds nothing between calls, and is replaceable.
# `claimstone` is a **batch job** — it runs, writes to an append-only ledger, and exits — so it sits behind
# a profile and is invoked with `run --rm`. Giving a job a restart policy is how a finished run becomes an
# infinite one.
#
# What this deliberately does **not** do, because the microservice shape would be wrong here:
#
# No service per stage. The six stages talk through append-only files, which is D7 and D9, and putting an
# HTTP boundary where a file boundary is the recorded decision would invent a distributed system for a
# single-writer workload of a few dozen megabytes — the same argument CLAUDE.md uses to refuse Postgres.
#
# No message broker. The work queue is `calls/<lane>/<batch>/requests.jsonl`, resumable by `call_id` and
# readable with `grep`. A broker would hold a second copy of it and be the authority on neither.
#
# No named volume for the store. A named volume is the portable choice and it is the wrong one: the whole
# argument for append-only JSONL is that it is diffable and auditable with `grep`, and a volume makes that
# require entering a container. Bind mounts, deliberately.

name: claimstone

services:
  grobid:
    # The official full build since D110 (deep-learning models on the GPU), pinned by **digest**, not by
    # tag. The paragraph below is about the build every figure before D110 was measured with; its TEI
    # stays at `tei/<sha>.xml`, the full build's under `tei/<image>/`, and each document row names its image.
    # Pinned by **digest**, not by tag. Measured: `latest-crf` produced 508 KB of TEI against 0.8.1's 91 KB
    # on the same PDF, so the image is an instrument and every corpus figure — 905,189 body characters, 472
    # chunks — was measured with this one. A tag can be re-pushed under the same name; a digest cannot.
    image: grobid/grobid:0.9.1-full@sha256:35c83afedde0469ab7aef01870a26f6c402ae96cba535db5269f223fadc534ce
    environment:
      # Required, not optional: the image's JVM cannot read cgroup v2 under Docker 29 and the container
      # dies at startup without it. This cost twenty minutes to diagnose once.
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport
    healthcheck:
      # The endpoint the client already uses. A healthcheck rather than a sleep, so `depends_on` can wait
      # on the condition instead of on a guess — GROBID takes tens of seconds to load its models.
      #
      # **In perl, because this image has no HTTP client.** The obvious `curl -fsS` version failed on every
      # probe with `/bin/sh: 1: curl: not found`, so the container was permanently unhealthy, and
      # `depends_on: service_healthy` then refused to start the job — while GROBID itself was answering
      # `true` the whole time. Checked inside the image: no curl, no wget, no nc, no python3, and perl at
      # /usr/bin/perl. A healthcheck written against tools the image does not have reports a broken parser
      # that works, which is worse than no healthcheck.
      test:
        - CMD-SHELL
        - >-
          perl -MIO::Socket::INET -e 'my $$s=IO::Socket::INET->new(PeerAddr=>"localhost:8070",Timeout=>4)
          or exit 1; print $$s "GET /api/isalive HTTP/1.0\r\nHost: localhost\r\n\r\n";
          my $$r=join("",<$$s>); exit($$r=~/true/?0:1)' 
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    # The full image (D110) loads deep-learning models beside the CRF ones and runs them on the GPU. The
    # CRF-only build measured 2.4 GB idle and 3.6 GB under load; the full one needs more, so the limit is
    # 12 GB on this 61 GB machine. The GPU reservation needs the NVIDIA container runtime; on a host
    # without one, GROBID's models run on the CPU only if this block is removed, and slowly.
    deploy:
      resources:
        limits:
          memory: 12g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks: [claimstone]
    # No published port. The engine reaches it by service name on the private network; publishing 8070 would
    # put an unauthenticated PDF parser on the LAN for no reason.

  claimstone:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        CLAIMSTONE_CODE_REVISION: ${CLAIMSTONE_CODE_REVISION:-unknown}
    # One image for the job and the portal API (D42: one code identity, never two builds that can drift).
    image: claimstone:local
    # A job, not a service: `up` must not start it. `docker compose run --rm claimstone <command>`.
    profiles: [cli]
    depends_on:
      grobid:
        condition: service_healthy
    environment:
      # Configuration from the environment, never from the image: this repository is public and the image
      # may reach a registry. `.env` holds these and is gitignored; `.env.example` is committed.
      CLAIMSTONE_CONTACT_EMAIL: ${CLAIMSTONE_CONTACT_EMAIL:?set it in .env — the APIs require an address and the code refuses to guess one}
      CLAIMSTONE_GROBID_URL: http://grobid:8070
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      # The two directories that must not live in an image. `store/` holds the fetched bytes of copyrighted
      # papers; `projects/` holds instances that encode a consuming system's internal design, which is why
      # both are gitignored.
      - ./store:/app/store
      - ./projects:/app/projects
      # A project instance must be **self-contained** to move. `projects/alembic-s4/manifest.tsv` is a
      # symlink into another repository, and a bind mount carries the link and not its target — so on any
      # host but the one that owns that path it dangles. `load_manifest` now refuses a link that points
      # nowhere rather than reading it as "no manifest", which used to drop 25 sources out of a round in
      # silence. The fix is to copy the file into the instance; `projects/*/manifest.tsv` is gitignored
      # either way. The escape hatch, on the development machine only:
      #   - /home/stefano/Documents/Projects/Alembic/docs/research:/home/stefano/Documents/Projects/Alembic/docs/research:ro
    # Writing to a bind mount as root would leave root-owned rows in a ledger the operator then cannot read.
    user: "${UID:-1000}:${GID:-1000}"
    networks: [claimstone]

  # Local trial worker. It only runs operations already authorized in the
  # append-only scheduler ledger; it does not plan research or sign verdicts.
  scheduler:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        CLAIMSTONE_CODE_REVISION: ${CLAIMSTONE_CODE_REVISION:-unknown}
    image: claimstone:local
    profiles: [trial]
    command: ["scheduler", "worker", "projects/alembic-s4-lungo", "--store", "store", "--max-operations", "1", "--poll-seconds", "10"]
    depends_on:
      grobid:
        condition: service_healthy
    environment:
      CLAIMSTONE_CONTACT_EMAIL: ${CLAIMSTONE_CONTACT_EMAIL:?set it in .env}
      CLAIMSTONE_GROBID_URL: http://grobid:8070
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./store:/app/store
      - ./projects:/app/projects:ro
    user: "${UID:-1000}:${GID:-1000}"
    networks: [claimstone]
    restart: unless-stopped
    stop_grace_period: 10m

  # The portal (D84, spec 2026-10-06-portal-frontend-docker-design.md §5 and §8). Two services behind a
  # profile, so `up` alone still starts only GROBID: `./portal.sh` brings these up.
  #
  # `api` is a read model, not a stage service: it re-reads the ledgers on every request and has no code
  # path that writes, which the read-only mounts below make structural — a write fails with EROFS instead
  # of succeeding quietly. It sits only on an internal network: no published port, no route to the
  # internet, and it receives no secret, only the word "present" for each configured key so the
  # administration page can show presence (`${VAR:+present}` substitutes the word, never the value).
  api:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        CLAIMSTONE_CODE_REVISION: ${CLAIMSTONE_CODE_REVISION:-unknown}
    image: claimstone:local
    command: ["api", "--host", "0.0.0.0", "--port", "8788", "--allow-host", "api:8788"]
    environment:
      CLAIMSTONE_ROOT: /app
      PYTHONDONTWRITEBYTECODE: "1"
      CLAIMSTONE_CONTACT_EMAIL: ${CLAIMSTONE_CONTACT_EMAIL:+present}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:+present}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:+present}
    volumes:
      - ./store:/app/store:ro
      - ./projects:/app/projects:ro
    user: "${UID:-1000}:${GID:-1000}"
    networks: [portal_internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Measured 2026-10-06: the index's ten parallel summaries over the real store peak at 1024 MB RSS.
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8788/api/v1/meta', headers={'Host': 'api:8788'}), timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # `control` is the authenticated write boundary (D89): sessions, signing, intake, decisions, exports,
  # administration. The read-only `api` above is unchanged; a defect in a read route still cannot write.
  # It writes the store (append-only ledgers, quarantine) and its own state (operator accounts), reads the
  # projects, and reaches nothing on the internet except through `control_egress`, which only the explicit
  # admin checks use. It publishes no port: the browser reaches it through `web` at /control/.
  control:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        CLAIMSTONE_CODE_REVISION: ${CLAIMSTONE_CODE_REVISION:-unknown}
    image: claimstone:local
    command: ["control", "--bind", "0.0.0.0", "--port", "8790",
              "--allow-host", "control:8790",
              "--allow-host", "127.0.0.1:${CLAIMSTONE_PORTAL_PORT:-8788}",
              "--allow-host", "localhost:${CLAIMSTONE_PORTAL_PORT:-8788}",
              "--state-dir", "/app/.claimstone",
              "--credentials-file", "none"]
    environment:
      CLAIMSTONE_ROOT: /app
      PYTHONDONTWRITEBYTECODE: "1"
      CLAIMSTONE_STATE_DIR: /app/.claimstone
      CLAIMSTONE_GROBID_URL: http://grobid:8070
      # Real values, unlike `api`: the admin checks send the contact address in their User-Agent and the
      # Ollama key to the unpaid model list. Credentials are rotated in `.env` on the host, not from here
      # (`--credentials-file none`).
      CLAIMSTONE_CONTACT_EMAIL: ${CLAIMSTONE_CONTACT_EMAIL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:+present}
    volumes:
      - ./store:/app/store
      - ./projects:/app/projects:ro
      - ./.claimstone:/app/.claimstone
    user: "${UID:-1000}:${GID:-1000}"
    networks: [portal_internal, claimstone, control_egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      # Anonymous GET of the session: 401 is the answer of a live server that refuses a stranger.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,urllib.error,sys\ntry:\n urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8790/control/v1/session', headers={'Host': 'control:8790'}), timeout=4)\nexcept urllib.error.HTTPError as e:\n sys.exit(0 if e.code == 401 else 1)\nsys.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # `web` is nginx serving the built SPA and proxying /api/ to `api`. It is the only published port, and
  # only on the host's loopback.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: claimstone-web:local
    depends_on:
      api:
        condition: service_healthy
      control:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLAIMSTONE_PORTAL_PORT:-8788}:8080"
    networks: [portal_internal, portal_edge]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  claimstone:
    driver: bridge
  # No egress: `api` reaches nothing but `web`.
  portal_internal:
    driver: bridge
    internal: true
  # Only for publishing web's port on the host's loopback.
  portal_edge:
    driver: bridge
  # Egress for `control` alone, used only by the explicit admin reachability checks (D106).
  control_egress:
    driver: bridge
