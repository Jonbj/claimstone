<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Claimstone: schema a sei blocchi</title>
  <desc>Protocollo vincola Pipeline, Selezione fonti e Ingresso manuale; la Pipeline produce profili di evidenza per la Lettura umana; l'Esecuzione osserva tutti i blocchi.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="#ffffff"/>

  <text x="60" y="44" font-size="26" font-weight="700" fill="#0f172a">Claimstone in sei blocchi</text>

  <!-- legenda -->
  <g font-size="14" fill="#334155">
    <rect x="640" y="26" width="18" height="18" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="666" y="40">agisci tu</text>
    <rect x="750" y="26" width="18" height="18" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="776" y="40">agisce Claimstone</text>
    <rect x="930" y="26" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="956" y="40">solo consultivo</text>
  </g>

  <!-- 1 Protocollo -->
  <rect x="60" y="80" width="1080" height="90" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="84" y="112" font-size="20" font-weight="700" fill="#78350f">1 · Protocollo</text>
  <text x="84" y="138" font-size="15" fill="#451a03">Temi · domande congelate · classi di fonte · soglia di acquisizione</text>
  <text x="84" y="158" font-size="14" fill="#78350f">Tu lo firmi (binding). Se cambia dopo, il flusso risulta «drifted» e si blocca.</text>

  <!-- frecce dal protocollo -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="200" y1="170" x2="200" y2="222"/>
    <line x1="600" y1="170" x2="600" y2="222"/>
    <line x1="1000" y1="170" x2="1000" y2="222"/>
  </g>

  <!-- 3 Selezione fonti -->
  <rect x="60" y="226" width="280" height="330" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="80" y="258" font-size="20" font-weight="700" fill="#1e293b">3 · Selezione fonti</text>
  <g font-size="15" fill="#334155">
    <text x="80" y="288">Affianca la pipeline.</text>
    <text x="80" y="320">Giudizi provvisori</text>
    <text x="80" y="340">(AI_PROVISIONAL)</text>
    <text x="80" y="372">Consiglia, non ammette:</text>
    <text x="80" y="402">· la coorte resta aperta</text>
    <text x="80" y="428">· 0 fonti ammesse da qui</text>
    <text x="80" y="454">· la tile non è mai «fatto»</text>
  </g>

  <!-- 2 Pipeline -->
  <rect x="400" y="226" width="400" height="330" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="420" y="258" font-size="20" font-weight="700" fill="#1e3a8a">2 · Pipeline</text>
  <g font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <rect x="418" y="276" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="473" y="301">discover</text>
    <rect x="545" y="276" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="600" y="301">acquire</text>
    <rect x="672" y="276" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="727" y="301">normalize</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#a)">
    <line x1="528" y1="296" x2="543" y2="296"/>
    <line x1="655" y1="296" x2="670" y2="296"/>
  </g>
  <!-- soglia -->
  <rect x="418" y="338" width="364" height="44" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="600" y="357" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">Soglia di acquisizione</text>
  <text x="600" y="374" font-size="13" fill="#9a3412" text-anchor="middle">sotto soglia: stop, nessun verdetto</text>
  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M727 316 V328 H600 V336"/>
  </g>
  <g font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">
    <rect x="418" y="412" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="473" y="437">extract</text>
    <rect x="545" y="412" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="600" y="437">review</text>
    <rect x="672" y="412" width="110" height="40" rx="8" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="727" y="437">synthesize</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M600 382 V398 H473 V410"/>
    <line x1="528" y1="432" x2="543" y2="432"/>
    <line x1="655" y1="432" x2="670" y2="432"/>
  </g>
  <g font-size="14" fill="#1e3a8a">
    <text x="420" y="486">Ogni affermazione porta una citazione</text>
    <text x="420" y="506">verbatim, verificata dal codice.</text>
    <text x="420" y="534">Un secondo modello rilegge ciascuna.</text>
  </g>

  <!-- 4 Ingresso manuale -->
  <rect x="860" y="226" width="280" height="330" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="880" y="258" font-size="20" font-weight="700" fill="#78350f">4 · Ingresso manuale</text>
  <g font-size="15" fill="#451a03">
    <text x="880" y="288">Quello che porti tu:</text>
    <text x="880" y="318">· materiale da aggiungere</text>
    <text x="880" y="344">· decisioni aperte</text>
    <text x="896" y="370">obbligatorie / facoltative</text>
    <text x="880" y="410" fill="#78350f" font-size="14">Se qualcosa è obbligatorio,</text>
    <text x="880" y="430" fill="#78350f" font-size="14">il blocco ti chiama.</text>
  </g>

  <!-- frecce laterali verso la pipeline -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="340" y1="390" x2="398" y2="390" stroke-dasharray="6 4"/>
    <line x1="860" y1="390" x2="802" y2="390"/>
  </g>

  <!-- pipeline -> lettura -->
  <g stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="600" y1="556" x2="600" y2="606"/>
  </g>
  <text x="616" y="586" font-size="14" fill="#334155">profili di evidenza</text>

  <!-- 6 Lettura umana -->
  <rect x="300" y="610" width="600" height="104" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="324" y="642" font-size="20" font-weight="700" fill="#78350f">6 · Lettura umana</text>
  <text x="324" y="670" font-size="15" fill="#451a03">Leggi il profilo, controlli le citazioni, firmi.</text>
  <text x="324" y="694" font-size="14" fill="#78350f">Il verdetto nasce solo dalla firma di una persona.</text>

  <!-- 5 Esecuzione -->
  <rect x="60" y="754" width="1080" height="90" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="84" y="786" font-size="20" font-weight="700" fill="#1e3a8a">5 · Esecuzione</text>
  <text x="84" y="812" font-size="15" fill="#1e3a8a">Osserva le operazioni di tutti i blocchi: autorizzate, in corso, concluse.</text>
  <text x="84" y="832" font-size="14" fill="#1e3a8a">Ogni chiamata a un modello registra backend, modello, versione dell'harness e hash del prompt.</text>
</svg>
