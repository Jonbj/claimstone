<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    %sveltekit.head%
  </head>
  <!-- No hover preloading: a summary or overview costs seconds of server computation, and
         hovering a link must not start one. No inline style attribute: the CSP forbids it. -->
  <body data-sveltekit-preload-data="off">
    <div class="app-root">%sveltekit.body%</div>
  </body>
</html>
