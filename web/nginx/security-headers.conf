# Included in every location that serves the SPA. nginx does not inherit `add_header` into a location that
# declares its own, so each location includes this file instead of relying on the server block.
#
# The CSP is a plain header (spec §8.4): a Vite build has no inline script, so nothing needs a hash.
# React's `style` prop goes through the CSSOM, which `style-src 'self'` allows; an injected <style>
# element would be blocked, and the F10 test keeps those out of the source.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
