# The portal's only published listener. It serves the static SPA and proxies /api/ to the read-only API
# container, which has no published port and no route to the internet.

server_tokens off;

# Any Host this server does not name gets 421: the DNS-rebinding defence moves here from the API, because
# the browser talks to nginx, not to the API (spec §4.3).
server {
    listen 8080 default_server;
    server_name _;
    return 421;
}

server {
    listen 8080;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;

    # The JSON read model. The API applies its own Host check, so the proxy names the one authority it
    # allows (`--allow-host api:8788`). The browser's Origin is blanked: the API does not need to know it,
    # and a GET carries no state to protect. The API sets its own CSP and no-store on every response.
    location /api/ {
        proxy_pass http://api:8788;
        proxy_set_header Host api:8788;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For "";
        proxy_http_version 1.1;
        # One flow overview on the real store takes seconds to compute; the index fires several at once.
        proxy_read_timeout 120s;
        limit_except GET { deny all; }
    }

    # Content-hashed build assets: safe to cache, they change name when they change content.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every client route falls back to the SPA shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
        try_files $uri /index.html;
    }
}
