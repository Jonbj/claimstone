name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest setuptools wheel
      - name: Validate project configs
        run: python -m claimstone.cli validate --all-projects
      - name: Installed wheel discovers every backend
        run: python docs/reviews/reproduce_wheel_2026_09_28.py
      - name: Tests
        run: pytest -q

      # A figure is comparable only against another produced by the same instrument. These two
      # version constants say which instrument; changing one without saying so in the file that
      # records measurements makes two incomparable numbers look like a trend.
      - name: Measurement instruments are versioned in step with what they measured
        run: python tools/check_instrument_versions.py
