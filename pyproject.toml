[project]
name = "claimstone"
version = "0.0.1"
description = "Topics in, verdicts out: an evidence base where every claim is bound to a verified verbatim quote."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "numpy>=1.26"]

[project.scripts]
claimstone = "claimstone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `projects/` holds per-project input data, not code: autodiscovery would package it.
[tool.setuptools]
packages = ["claimstone"]
