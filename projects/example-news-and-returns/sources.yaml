# Admissible source classes, most authoritative first.
# Classes are never silently mixed: every claim carries the class of its source, and
# synthesis reports per class before it reports pooled.
classes:
  - id: ACA
    name: peer-reviewed academic
    weight_hint: highest
    notes: version of record in a refereed venue
    # Applied by the engine, declared here: "a journal article is refereed" is domain knowledge
    # and invariant 4 keeps it out of the package. The first declared class to match wins, and
    # classes are declared most-authoritative-first, so a refereed paper whose only open copy
    # sits on a preprint host stays ACA.
    assign_when:
      openalex_source_type: [journal]
      crossref_type: [journal-article]
  - id: WP
    name: working paper / preprint
    weight_hint: high
    notes: NBER, SSRN, arXiv; not refereed — never silently promoted to ACA
    assign_when:
      source_api: [arxiv]
      openalex_source_type: [repository]
      host: [papers.ssrn.com, ssrn.com, nber.org]
  - id: MET
    name: methodological reference
    weight_hint: high
    notes: textbook, handbook chapter, methods guide; supports design not effect size
    assign_when:
      crossref_type: [book, book-chapter, monograph, reference-book]
    # Declared, never read off the id: the method verdict rule asks which classes are
    # methodological, and inferring it from "MET" would put domain knowledge in the engine.
    role: methodological
  - id: IND
    name: industry / practitioner research
    weight_hint: medium
    notes: vendor and sell-side research; disclose the commercial interest
  - id: NEW
    name: journalism / secondary reporting
    weight_hint: low
    notes: admissible as a pointer to a primary source, never as evidence for an effect
  - id: DOC
    name: primary documentation
    weight_hint: context
    notes: exchange rules, provider API docs, regulatory filings
    # A filing or a rulebook cites nothing. Requiring a reference list would reject every source
    # of this class, so the genre carries its own gate policy rather than the project flipping a
    # switch that also loosens the gate for papers.
    gate_policy:
      structural_signal: none

# A round may not produce verdicts if fewer than this share of *found* sources
# were actually obtained. See README, "Admissibility".
#
# Changing this is a dated, versioned, motivated event — the same standard as a
# question-registry bump. It is lowered only on evidence that a class of sources is
# structurally unobtainable, never because a measured rate was inconvenient.
acquisition_floor: 0.80
floor_version: 1
floor_set_at: 2026-09-22
floor_rationale: >
  Set before the first measured round. Below this share, per-question coverage stops being
  interpretable: a question with no claims cannot be placed between NEVER_ASKED and
  UNANSWERED_IN_LITERATURE when a quarter of the corpus was never read.

# Never fetched, whatever the fallback chain suggests.
excluded_hosts:
  - sci-hub.se
  - sci-hub.st
  - libgen.is
