# Admissible source classes, most authoritative first. Same vocabulary as any other instance: the engine
# holds no domain knowledge, so a class and the rules that assign it are data.
classes:
  - id: ACA
    name: peer-reviewed academic
    weight_hint: highest
    notes: version of record in a refereed venue
    aliases: [academic]
    assign_when:
      openalex_source_type: [journal]
      # A refereed conference paper is refereed. Declared for this field, where proceedings carry real
      # results; a field where they do not would leave the rule out.
      crossref_type: [journal-article, proceedings-article]
  - id: WP
    name: working paper / preprint
    weight_hint: high
    notes: PsyArXiv, SSRN, arXiv; not refereed — never silently promoted to ACA
    assign_when:
      source_api: [arxiv]
      openalex_source_type: [repository]
      # `posted-content` is Crossref's word for a preprint, and discovery found 24 of them. Declared here
      # rather than promoted to ACA: the class note says a preprint is never silently promoted.
      crossref_type: [posted-content]
      host: [psyarxiv.com, osf.io, papers.ssrn.com, ssrn.com, arxiv.org]
  - id: MET
    name: methodological reference
    weight_hint: high
    notes: meta-analysis, systematic review, methods guide; supports design, not a single effect size
    # Declared, never read off the id: the method verdict rule asks which classes are methodological, and
    # inferring that from the letters "MET" would put domain knowledge in the engine.
    role: methodological
    aliases: [method]
    assign_when:
      crossref_type: [book, book-chapter, monograph, reference-book]
      openalex_source_type: [book-series]
  - id: IND
    name: industry / practitioner research
    weight_hint: medium
    notes: platform and consultancy research; disclose the commercial interest
    aliases: [industry]
  - id: THESIS
    name: doctoral or master's thesis
    weight_hint: medium
    notes: examined but not refereed; often the fullest account of a study that was published in part
    assign_when:
      crossref_type: [dissertation]
  - id: NEW
    name: journalism / secondary reporting
    weight_hint: low
    notes: admissible as a pointer to a primary source, never as evidence for an effect

# A round may not produce verdicts if fewer than this share of *found* sources were obtained.
#
# The same 0.80 as every other instance, deliberately. Setting a pilot's floor lower to make it pass would
# be the one move that is off the table, and the pilot's whole purpose is to find out whether a corpus can
# clear this number rather than to prove that a lower one can be cleared.
acquisition_floor: 0.80
floor_version: 1
floor_set_at: 2026-09-28
floor_rationale: >
  Identical to alembic-s4's, so the two are comparable. A pilot that cleared a private floor would
  demonstrate nothing about the corpus that motivated the project.

# Never fetched, whatever the fallback chain suggests.
excluded_hosts:
  - sci-hub.se
  - sci-hub.st
  - libgen.is

citation_channel:
  min_citations_in_corpus: 2
  min_year: 2010
  require_title_chars: 25

# The notation this field writes a figure in. Declared here and not in the engine: a list of these in
# `claimstone/` is domain knowledge, which invariant 4 forbids, and the engine's list shipped with `sharpe`
# and without `OR` — so 63 estimates in the first PMC round were refused over `AOR=1.66` and `ß = -.22`.
#
# Added to the engine's generic statistics (t, se, sd, p, z, n, mean, median), never replacing them: an
# epidemiology paper still reports standard errors.
extraction:
  value_labels:
    # Ratio measures, as written with and without the adjustment marker.
    - OR
    - aOR
    - AOR
    - adjusted OR
    - odds ratio
    - adjusted odds ratio
    - RR
    - aRR
    - risk ratio
    - relative risk
    - HR
    - aHR
    - hazard ratio
    - IRR
    - incidence rate ratio
    - PR
    - prevalence ratio
    # Regression and effect-size coefficients. The Eszett is in the list because papers typeset it for
    # beta and a reader cannot tell them apart; both forms appear in this corpus.
    - beta
    - ß
    - β
    - b
    - B
    - d
    - Cohen's d
    - g
    - Hedges' g
    - r
    - rho
    - ρ
    - R2
    - R²
    - eta2
    - η2
    # Interval and dispersion labels, for the uncertainty field.
    - CI
    - 95% CI
    - 99% CI
    - IQR
    - SEM
